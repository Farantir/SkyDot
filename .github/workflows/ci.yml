# SPDX-License-Identifier: GPL-3.0-or-later
name: CI

on:
  push:
    branches: [main]
    # A vX.Y.Z tag publishes the packaged builds as a GitHub Release.
    tags: ["v*"]
  pull_request:

env:
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-cache
  VCPKG_DISABLE_METRICS: "1"
  GODOT_VERSION: "4.7.2"

jobs:
  guards:
    name: Repository rules
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Cheap checks from CONTRIBUTING.md; run before building.
      - name: No Bethesda bytes in git
        run: ./tools/ci/check-no-game-data.sh
      - name: All untrusted input through SpanReader
        run: ./tools/ci/check-raw-access.sh

  converter:
    name: converter ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc-debug-asan
            os: ubuntu-24.04
            preset: linux-debug-asan
            cc: gcc-14
            cxx: g++-14
            testpack: true
          # clang 18 with Ubuntu's libstdc++ has no std::expected.
          - name: linux-clang-release
            os: ubuntu-24.04
            preset: linux-release
            cc: clang-19
            cxx: clang++-19
            apt: clang-19 clang-tools-19
          - name: windows-msvc-release
            os: windows-2022
            preset: windows-release
    defaults:
      run:
        working-directory: converter
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Compiler
        if: matrix.apt
        run: sudo apt-get update -q && sudo apt-get install -y -q ${{ matrix.apt }}

      # Full clone: vcpkg.json's builtin-baseline must exist in vcpkg's history.
      - name: Install vcpkg
        shell: bash
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            "$VCPKG_ROOT"/bootstrap-vcpkg.bat -disableMetrics
          else
            "$VCPKG_ROOT"/bootstrap-vcpkg.sh -disableMetrics
          fi
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-${{ matrix.name }}-${{ hashFiles('converter/vcpkg.json') }}

      # Otherwise Ninja finds the runner's MinGW GCC before MSVC.
      - name: MSVC on PATH for the Ninja generator
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        # Fail if a sanitizer runtime is missing instead of dropping it.
        run: cmake --preset ${{ matrix.preset }} -DBETHCONV_SANITIZE_STRICT=ON

      # -k 0: report every failing file, not only the first.
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -- -k 0

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

      # Synthetic, no game data: the engine's tests run against it.
      - name: Publish the test pack
        if: matrix.testpack
        uses: actions/upload-artifact@v4
        with:
          name: testpack
          path: converter/build/${{ matrix.preset }}/tests/testpack/out/pack
          if-no-files-found: error

  engine:
    name: engine ${{ matrix.name }}
    needs: converter
    # The test pack comes from one converter job; the others need not pass.
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-gcc-debug
            os: ubuntu-24.04
            preset: linux-debug
            cc: gcc-14
            cxx: g++-14
          # Debug: the smoke tests run the editor, which loads only the
          # template_debug library.
          - name: linux-clang-debug
            os: ubuntu-24.04
            preset: linux-debug
            cc: clang-18
            cxx: clang++-18
          - name: windows-msvc-debug
            os: windows-2022
            preset: windows-debug
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Godot editor (headless runs only; the smoke tests are editor runs)
        if: runner.os == 'Linux'
        run: |
          curl -sSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo install -m 755 "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot4.7

      - name: Godot editor (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          curl -sSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_win64.exe.zip"
          unzip -q godot.zip -d godot
          # Plain godot.exe: find_program reads "godot4.7" as a name with an
          # extension and never tries godot4.7.exe.
          mv "godot/Godot_v${GODOT_VERSION}-stable_win64.exe" godot/godot.exe
          cygpath -w "$PWD/godot" >> "$GITHUB_PATH"

      - name: MSVC on PATH for the Ninja generator
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        shell: bash
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake --preset ${{ matrix.preset }} -DSKYDOT_TESTPACK="${{ github.workspace }}/testpack"

      # -k 0: report every failing file, not only the first.
      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} -- -k 0

      # Native tests of skydot_core: no editor, no test pack, so they run
      # before the pack is fetched and report even if the converter job failed.
      - name: Unit tests
        run: ctest --preset ${{ matrix.preset }} -L unit

      - name: The converter's test pack
        uses: actions/download-artifact@v4
        with:
          name: testpack
          path: ${{ github.workspace }}/testpack

      - name: Smoke tests
        env:
          SKYDOT_TESTPACK_REQUIRE: "1"
        run: ctest --preset ${{ matrix.preset }} -LE unit

  # Release builds of bethconv and the extension for other machines: no
  # runtime the player has to install. Not on pull requests.
  binaries:
    name: binaries ${{ matrix.name }}
    if: github.event_name == 'push'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Static libstdc++ and libgcc; libgomp ships next to bethconv,
          # which finds it through the rpath.
          - name: linux-x86_64
            os: ubuntu-24.04
            preset: linux-release
            cc: gcc-14
            cxx: g++-14
            converter_flags: "-DCMAKE_EXE_LINKER_FLAGS='-static-libstdc++ -static-libgcc' -DCMAKE_BUILD_RPATH='$ORIGIN'"
            engine_flags: -DGODOTCPP_USE_STATIC_CPP=ON
          # vcpkg's DLLs and the VC++ runtime ship next to bethconv.exe.
          - name: windows-x86_64
            os: windows-2022
            preset: windows-release
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install vcpkg
        shell: bash
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$VCPKG_ROOT"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            "$VCPKG_ROOT"/bootstrap-vcpkg.bat -disableMetrics
          else
            "$VCPKG_ROOT"/bootstrap-vcpkg.sh -disableMetrics
          fi
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"

      - name: Cache vcpkg binaries
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: vcpkg-binaries-${{ matrix.name }}-${{ hashFiles('converter/vcpkg.json') }}

      - name: MSVC on PATH for the Ninja generator
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build bethconv
        shell: bash
        working-directory: converter
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake --preset ${{ matrix.preset }} -DBETHCONV_BUILD_TESTS=OFF ${{ matrix.converter_flags }}
          cmake --build --preset ${{ matrix.preset }}

      - name: Build the extension
        shell: bash
        working-directory: engine
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: |
          cmake --preset ${{ matrix.preset }} -DSKYDOT_BUILD_TESTS=OFF ${{ matrix.engine_flags }}
          cmake --build --preset ${{ matrix.preset }}

      - name: Collect
        shell: bash
        run: ./tools/ci/collect-binaries.sh "${{ matrix.preset }}" dist

      - uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.name }}
          path: dist
          if-no-files-found: error

  # Exports the game for both platforms from Linux and puts bethconv next to
  # it, where the pack tool looks first (engine/game/packtool/bethconv.gd).
  package:
    name: package
    # Only tested builds are packaged.
    needs: [converter, engine, binaries]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: binaries-*
          path: binaries

      - name: Godot templates (cached)
        id: templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          key: godot-templates-${{ env.GODOT_VERSION }}

      - name: Godot editor and export templates
        run: |
          curl -sSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo install -m 755 "Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot4.7
          if [[ "${{ steps.templates.outputs.cache-hit }}" != "true" ]]; then
            dir="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
            curl -sSL -o templates.tpz \
              "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
            mkdir -p "$dir"
            unzip -q -j templates.tpz templates/version.txt \
              templates/linux_release.x86_64 templates/windows_release_x86_64.exe -d "$dir"
            rm templates.tpz
          fi

      - name: Package
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"; else version="$(git rev-parse --short HEAD)"; fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          ./tools/ci/package.sh "$version" binaries out

      - uses: actions/upload-artifact@v4
        with:
          name: skydot-${{ env.VERSION }}
          path: out/*
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" out/* --title "SkyDot $VERSION" --generate-notes \
            --notes "How to install and play: [README](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/README.md#how-to-play)."
